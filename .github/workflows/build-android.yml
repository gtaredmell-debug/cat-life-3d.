
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build folder
        run: mkdir -p build

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export APK
        run: godot --headless --path . --export-debug "Android" build/CatLife3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatLife3D-Android-APK
          path: build/CatLife3D.apk
          if-no-files-found: error
          
